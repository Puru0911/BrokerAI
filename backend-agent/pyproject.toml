[project]
name = "brokerai-agent-backend"
version = "0.1.0"
description = "BrokerAI agentic backend (FastAPI + LangChain tools + RAG)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.0.3",
  "asyncpg>=0.29.0",
  "chromadb>=1.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "langchain-core>=0.3.0",
  "langchain-groq>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-openrouter>=0.2.8",
  "python-dotenv>=1.0.1",
  "cryptography>=43.0.0",
  "pywebpush>=2.0.0",
  "PyJWT>=2.8.0",
  "alembic>=1.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "TRY004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
